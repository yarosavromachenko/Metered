# Layer rules inside a module (see docs/engineering-guidelines.md).
#
#   Domain          knows nothing but itself and a short allow-list of value libraries
#   Application     knows Domain and its own ports
#   Infrastructure  knows Domain, Application and the framework
#   Presentation    knows Application and the framework; may read its own module's
#                   Eloquent models (CQRS read side) — writes go through handlers,
#                   which is enforced by a Pest arch test, not by Deptrac.
deptrac:
  paths:
    - ./src
    - ./app

  layers:
    - name: Domain
      collectors:
        - type: classNameRegex
          value: '#^Metered\\[A-Za-z]+\\Domain\\.*#'

    - name: Application
      collectors:
        - type: classNameRegex
          value: '#^Metered\\[A-Za-z]+\\Application\\.*#'

    - name: Infrastructure
      collectors:
        - type: classNameRegex
          value: '#^Metered\\[A-Za-z]+\\Infrastructure\\(?!Laravel\\[A-Za-z]*ServiceProvider$).*#'

    # A service provider is a composition root: its whole job is to know every
    # layer well enough to wire them together. Pretending otherwise would mean
    # either a layer violation or a second place where wiring lives, and both
    # are worse than naming the exception.
    - name: CompositionRoot
      collectors:
        - type: classNameRegex
          value: '#^Metered\\[A-Za-z]+\\Infrastructure\\Laravel\\[A-Za-z]*ServiceProvider$#'

    - name: Presentation
      collectors:
        - type: classNameRegex
          value: '#^Metered\\[A-Za-z]+\\Presentation\\.*#'

    - name: LaravelGlue
      collectors:
        - type: classNameRegex
          value: '#^App\\.*#'

    # Third-party groupings, so that "Domain must not see Laravel" is a rule
    # Deptrac can actually check rather than silently ignore.
    - name: Laravel
      collectors:
        - type: classNameRegex
          value: '#^(Illuminate|Laravel)\\.*#'

    - name: Filament
      collectors:
        - type: classNameRegex
          value: '#^(?!Filament\\Models\\Contracts\\)(?!Filament\\Panel$)(Filament|Livewire)\\.*#'

    # The one exception to "Infrastructure knows nothing about the UI": the
    # authenticatable model must declare whether the person may enter the
    # panel, and Filament asks by interface. The Panel class comes with it,
    # because implementing the interface means naming its argument. Everything
    # else under Filament\ stays out of Infrastructure.
    - name: FilamentUserContracts
      collectors:
        - type: classNameRegex
          value: '#^Filament\\(Models\\Contracts\\.*|Panel)$#'

    # The only third-party code Domain is allowed to touch.
    - name: DomainSafeVendor
      collectors:
        - type: classNameRegex
          value: '#^(Brick\\(Money|Math)|Psr\\Clock|Ramsey\\Uuid|Symfony\\Component\\Clock)\\.*#'

  ruleset:
    Domain:
      - DomainSafeVendor

    Application:
      - Domain
      - DomainSafeVendor

    Infrastructure:
      - Domain
      - Application
      - DomainSafeVendor
      - Laravel
      - FilamentUserContracts

    Presentation:
      - Application
      - Infrastructure   # read models only; mutations are blocked by an arch test
      - Domain           # read-only value objects rendered in the UI
      - DomainSafeVendor
      - Laravel
      - Filament
      - FilamentUserContracts

    CompositionRoot:
      - Domain
      - Application
      - Infrastructure
      - Presentation
      - DomainSafeVendor
      - Laravel
      - Filament

    LaravelGlue:
      - Application
      - Infrastructure
      - Presentation
      - CompositionRoot
      - DomainSafeVendor
      - Laravel
      - Filament

    Laravel: ~
    Filament: ~
    FilamentUserContracts: ~
    DomainSafeVendor: ~
