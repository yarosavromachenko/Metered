name: metered

# The worker containers are built from the same image as the web app, and so
# inherit FrankenPHP's healthcheck against its admin endpoint on port 2019.
# None of them serves HTTP, so that check can only ever fail — and a service
# reported "unhealthy" forever is how a whole column stops being read. A daemon
# whose liveness is "the process is running" already has that answered by the
# restart policy.
x-no-inherited-healthcheck: &no-inherited-healthcheck
  disable: true

# Host ports are overridable, because a developer machine usually has another
# project already holding 8080. Set APP_PORT in .env to move them.

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - .:/app
    # Anything the container writes into the mounted source tree — published
    # config, a generated migration — should belong to the developer, not to
    # root. Override with DOCKER_UID/DOCKER_GID if yours are not 1000.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    # Only process-level variables here. Everything Laravel reads comes from
    # .env, which the entrypoint seeds from .env.example.
    #
    # The application's own settings are deliberately NOT repeated here: a
    # variable present in the container's environment cannot be overridden by
    # the test runner, and the suite silently ran against the development
    # database until that was found.
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_DATA_HOME: /tmp/.local/share
      # Raised for a load run, where the per-key limit would otherwise be
      # what is measured: API_KEY_RATE_LIMIT_PER_MINUTE=1000000 make up.
      API_KEY_RATE_LIMIT_PER_MINUTE: ${API_KEY_RATE_LIMIT_PER_MINUTE:-600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      mailpit:
        condition: service_started
    # Readiness, not liveness: compose restarts nothing on "unhealthy", so here
    # the status is information — `docker compose ps` shows an app that cannot
    # reach its database or is shedding ingestion load. A 503 makes
    # file_get_contents return false.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health/ready') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # The relay publishes committed outbox messages. It is a daemon rather than a
  # scheduled command because the delay between a state change and its event is
  # latency a customer feels.
  outbox-relay:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    command: ["php", "artisan", "outbox:relay"]
    healthcheck: *no-inherited-healthcheck
    volumes:
      - .:/app
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_DATA_HOME: /tmp/.local/share
      APP_ENV: local
      # Daemons bypass PgBouncer: transaction pooling does not preserve the
      # session state that SELECT ... FOR UPDATE SKIP LOCKED relies on.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: metered
      DB_USERNAME: metered
      DB_PASSWORD: secret
      OUTBOX_CONNECTION: pgsql
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The ingestion daemon. Scaled with replicas rather than threads: the
  # consumer group hands each replica its own messages, and two replicas
  # cannot be given the same one (ADR-0003).
  usage-consumer:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    command: ["php", "artisan", "usage:consume"]
    healthcheck: *no-inherited-healthcheck
    volumes:
      - .:/app
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_DATA_HOME: /tmp/.local/share
      APP_ENV: local
      # Direct to PostgreSQL, like the relay: this process holds a connection
      # across many transactions, and PgBouncer's transaction pooling hands a
      # backend to whoever asks next.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: metered
      DB_USERNAME: metered
      DB_PASSWORD: secret
      USAGE_CONNECTION: pgsql
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # SIGTERM finishes the batch in hand; ten seconds is generous for a batch
    # of five hundred and short enough that a deploy does not crawl.
    stop_grace_period: 10s
    restart: unless-stopped

  horizon:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    command: ["php", "artisan", "horizon"]
    healthcheck: *no-inherited-healthcheck
    volumes:
      - .:/app
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_DATA_HOME: /tmp/.local/share
      APP_ENV: local
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_DIRECT_HOST: postgres
      DB_DIRECT_PORT: "5432"
      DB_DATABASE: metered
      DB_USERNAME: metered
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Runs routes/console.php once a minute: the period close every five
  # minutes, the partition check once a day. It only decides what is due;
  # the work runs on Horizon's queues.
  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    command: ["php", "artisan", "schedule:work"]
    healthcheck: *no-inherited-healthcheck
    volumes:
      - .:/app
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_DATA_HOME: /tmp/.local/share
      APP_ENV: local
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_DIRECT_HOST: postgres
      DB_DIRECT_PORT: "5432"
      DB_DATABASE: metered
      DB_USERNAME: metered
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # A stand-in for a tenant's system, for the demo's webhooks: it answers by
  # path (/ok, /flaky, /down, /slow, /gone), checks signatures against the
  # secrets pasted into it, and lists what arrived at http://localhost:8089.
  # The SSRF guard refuses private addresses, and lets this one through only
  # because WEBHOOKS_TRUSTED_DESTINATION names it exactly (ADR-0011).
  webhook-receiver:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    command: ["php", "-S", "0.0.0.0:8080", "docker/webhook-receiver/index.php"]
    healthcheck: *no-inherited-healthcheck
    volumes:
      - .:/app
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      # Several workers, so a /slow delivery does not hold up the others.
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "127.0.0.1:${WEBHOOK_RECEIVER_PORT:-8089}:8080"
    restart: unless-stopped

  # Dashboards for the demo, provisioned from docker/grafana so a clean clone
  # gets them without a click. Anonymous visitors can view, not edit.
  grafana:
    image: grafana/grafana:13.0.8
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/live-load.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Load profile only: `make load`. Not part of `make up`.
  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    volumes:
      - ./k6:/scripts:ro
    environment:
      METERED_URL: http://app:8080
      METERED_KEY: ${METERED_KEY:-}
      METERED_METER: ${METERED_METER:-api.requests}
      METERED_CUSTOMER: ${METERED_CUSTOMER:-cus_bench}
      CUSTOMERS: ${CUSTOMERS:-120}
      BATCH: ${BATCH:-50}
      # Names the run inside the event ids it sends, so two runs are two sets
      # of events rather than one set and a pile of duplicates.
      RUN: ${RUN:-}
    depends_on:
      - app

  # Catches every message the application sends, and shows it in a browser.
  # Nothing leaves the machine, which is the only acceptable arrangement for a
  # demo that strangers sign up to.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: metered
      POSTGRES_USER: metered
      POSTGRES_PASSWORD: secret
      # scram-sha-256 is the default in modern PostgreSQL; stating it keeps the
      # PgBouncer userlist and the server in agreement.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-metered.sh:/docker-entrypoint-initdb.d/10-metered.sh:ro
    command:
      # Room for the daemons plus the pool, and enough work memory for the
      # aggregate upserts to sort in memory rather than on disk.
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_wal_size=2GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metered -d metered"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p0
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: metered
      # The image listens on 5432 by default. Moving the pool to 6432 keeps the
      # two routes to the database distinguishable at a glance: 6432 is pooled,
      # 5432 is direct.
      LISTEN_PORT: "6432"
      DB_USER: metered
      DB_PASSWORD: secret
      # Transaction pooling is what lets a handful of PostgreSQL backends serve
      # many Octane workers: a backend is held for a transaction, not for a
      # request. The cost is session state — advisory locks, LISTEN/NOTIFY and
      # server-side prepared statements — which is why the daemons bypass this
      # service entirely. See docs/adr/0003-redis-streams-ingestion.md.
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      MAX_PREPARED_STATEMENTS: "200"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - "${PGBOUNCER_PORT:-56432}:6432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    # appendonly with everysec is the durability the ingestion design assumes,
    # and the reason a 202 can cost up to one second of events on a crash.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_PORT_HOST:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  mailpit-data:
