name: Change proposal
description: Propose a change in behaviour or scope
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is not possible today, and for whom.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Required. A proposal with no rejected alternative is a wish, not a decision.
    validations:
      required: true

  - type: dropdown
    id: adr
    attributes:
      label: Does this need an ADR?
      options:
        - "Yes — it changes architecture or a guarantee"
        - "No — it is contained inside one module"
    validations:
      required: true
