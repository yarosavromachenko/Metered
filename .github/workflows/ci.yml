name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4

      - name: composer validate
        run: composer validate --strict

      - name: Pint
        run: vendor/bin/pint --test

      - name: Rector
        run: vendor/bin/rector process --dry-run

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4

      - name: Larastan (level max, no baseline)
        run: vendor/bin/phpstan analyse --error-format=github --memory-limit=1G

      - name: Deptrac — layers
        run: vendor/bin/deptrac analyse --config-file=deptrac.layers.yaml --formatter=github-actions

      - name: Deptrac — module boundaries
        run: vendor/bin/deptrac analyse --config-file=deptrac.modules.yaml --formatter=github-actions

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v4

      - name: composer audit
        run: composer audit --locked

      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  tests:
    name: Tests
    runs-on: ubuntu-latest

    # Whether the unit suite exists yet. hashFiles() cannot answer this in a
    # job-level `if`, because that is evaluated before any checkout happens.
    outputs:
      has_unit_tests: ${{ steps.unit_suite.outputs.found }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: metered_testing
          POSTGRES_USER: metered
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U metered"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: metered_testing
      DB_USERNAME: metered
      DB_PASSWORD: secret
      # The suite's own connection, named here because .env.example points it
      # at a Docker service that does not exist on a runner.
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 5432
      TEST_DB_DATABASE: metered_testing
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, zip, pcntl, posix
          coverage: pcov
          tools: composer:v2

      - uses: ramsey/composer-install@v4

      - name: Detect the unit suite
        id: unit_suite
        run: |
          if [ -n "$(find tests/Unit -name '*.php' -print -quit 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Pest with coverage
        run: |
          mkdir -p build/coverage
          vendor/bin/pest --coverage --min=85 \
            --coverage-clover=build/coverage/clover.xml \
            --log-junit=build/junit.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage
          retention-days: 7

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    needs: tests
    # Mutation testing measures unit tests over domain logic. Until a module
    # has both, there is nothing to mutate and the job would only produce a red
    # cross that means nothing. It arms itself with the first unit test.
    if: needs.tests.outputs.has_unit_tests == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, zip, pcntl
          coverage: pcov
          tools: composer:v2

      - uses: ramsey/composer-install@v4

      - name: Mutation testing on the domain layers
        run: |
          vendor/bin/pest --mutate --parallel \
            --class='Metered\Shared\Domain,Metered\Usage\Domain,Metered\Billing\Domain,Metered\Invoicing\Domain' \
            --min=85 \
            --ignore-min-score-on-zero-mutations

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, static, security, tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/app/Dockerfile
          failure-threshold: info

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # github.repository keeps the repository's own capitalisation, and an OCI
      # repository name must be lowercase. Fold it once, here, and use the
      # result everywhere the image is named.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Two image scans, because the two halves of the image are not equally
      # actionable. Operating system packages are ours to fix by rebuilding on a
      # patched base, so they gate the build. The FrankenPHP binary statically
      # links its own Go dependencies, and their advisories can only be resolved
      # by an upstream release — blocking a build on those would train everyone
      # to ignore a red cross. They are reported and kept as an artifact instead.
      - name: Trivy (image, OS packages)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os

      - name: Trivy (image, full inventory)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
          format: table
          output: trivy-image.txt

      - name: Upload the image vulnerability report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-report
          path: trivy-image.txt
          retention-days: 30
