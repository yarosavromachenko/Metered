name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: composer validate
        run: composer validate --strict

      - name: Pint
        run: vendor/bin/pint --test

      - name: Rector
        run: vendor/bin/rector process --dry-run

  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Larastan (level max, no baseline)
        run: vendor/bin/phpstan analyse --error-format=github --memory-limit=1G

      - name: Deptrac — layers
        run: vendor/bin/deptrac analyse --config-file=deptrac.layers.yaml --formatter=github-actions

      - name: Deptrac — module boundaries
        run: vendor/bin/deptrac analyse --config-file=deptrac.modules.yaml --formatter=github-actions

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: composer audit
        run: composer audit --locked

      - name: Trivy (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: metered_testing
          POSTGRES_USER: metered
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U metered"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: metered_testing
      DB_USERNAME: metered
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, zip, pcntl, posix
          coverage: pcov
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Pest with coverage
        run: |
          mkdir -p build/coverage
          vendor/bin/pest --coverage --min=85 \
            --coverage-clover=build/coverage/clover.xml \
            --log-junit=build/junit.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage
          retention-days: 7

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    needs: tests
    # Mutation testing measures unit tests over domain logic. Until a module
    # has both, there is nothing to mutate and the job would only produce a red
    # cross that means nothing. It arms itself with the first unit test.
    if: hashFiles('tests/Unit/**/*.php') != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, zip, pcntl
          coverage: pcov
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Infection (changed lines on PRs, full run on main)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            vendor/bin/infection --threads=max --logger-github \
              --git-diff-lines --git-diff-base=origin/main \
              --ignore-msi-with-no-mutations
          else
            vendor/bin/infection --threads=max --logger-github \
              --ignore-msi-with-no-mutations
          fi

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, static, security, tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/app/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (image)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
