name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      # The tagged commit must already have passed the full CI run on main; the
      # image that run pushed is the one that gets the version tags.
      - name: Require a green CI run on main for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --branch main \
            --commit "$GITHUB_SHA" \
            --json conclusion \
            --jq '[.[] | select(.conclusion == "success")] | length')
          if [ "$conclusion" -lt 1 ]; then
            echo "::error::No successful CI run on main for $GITHUB_SHA. Tag a commit that went green on main."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Version tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Tag the tested image
        env:
          SOURCE: ${{ steps.image.outputs.name }}:${{ github.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          for tag in $TAGS; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" "$SOURCE"
          docker buildx imagetools inspect "$SOURCE" | grep -m1 '^Digest:'
