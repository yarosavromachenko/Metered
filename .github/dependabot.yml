version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the dev toolchain: these move together and are covered by CI.
      quality-tools:
        patterns:
          - "laravel/pint"
          - "larastan/*"
          - "rector/*"
          - "qossmic/deptrac*"
          - "infection/*"
          - "pestphp/*"
      laravel:
        patterns:
          - "laravel/framework"
          - "laravel/octane"
          - "laravel/horizon"
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [ci]

  - package-ecosystem: docker
    directory: /docker/app
    schedule:
      interval: weekly
    labels: [dependencies]
