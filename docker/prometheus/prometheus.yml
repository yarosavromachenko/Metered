# Prometheus scrapes one target: the collector, which holds what every
# process of the application exported (ADR-0019). It evaluates the rules in
# rules/ and sends what fires to Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules/metered.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: otel-collector
    # The application's own job and instance labels, from service.name and
    # service.instance.id, are kept rather than replaced by the collector's.
    honor_labels: true
    static_configs:
      - targets: ['otel-collector:8889']
