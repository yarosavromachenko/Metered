# The live-load dashboard reads PostgreSQL directly, as a role that can only
# read (docker/postgres/init-metered.sh). Traces come from Tempo.
apiVersion: 1

datasources:
  - name: Metered
    uid: metered-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    jsonData:
      database: metered
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
    secureJsonData:
      password: grafana-reader

  - name: Tempo
    uid: metered-tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      search:
        hide: false
