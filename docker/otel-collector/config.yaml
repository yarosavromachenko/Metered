# Every process of the application exports OTLP/HTTP here; the collector
# batches it and hands traces to Tempo. The application knows one endpoint,
# so where telemetry is stored can change without touching it (ADR-0012).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
