; Settings shared by every PHP process in this project.

memory_limit = 512M
max_execution_time = 60
error_reporting = E_ALL
display_errors = Off
log_errors = On

; Octane keeps the process alive between requests, so opcache is not a
; per-request warm-up cost here — it is simply how the code is loaded.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Money is computed with brick/math, never with these — but a wrong default
; here would still silently change behaviour in any third-party code.
serialize_precision = -1
precision = 14

date.timezone = UTC
